{% extends "base.html" %}

{% block content %}
<h1>Create a group</h1>
<form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.group_name.label }}<br>
            {{ form.group_name(size=32) }}
        </p>
    <p>
            {{ form.topic.label }}<br>
            {{ form.topic }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
