{% extends "base.html" %}

{% block content %}
<h1>Edit a topic</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.topic.label }}<br>
            {{ form.topic(size=32) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
